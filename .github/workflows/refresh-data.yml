name: Refresh site data

# Tuesday after Monday Night Football (14:00 UTC = 6-7am Pacific), whenever a new
# data.json is pushed from the local model pipeline, or by hand from the Actions tab.
on:
  schedule:
    - cron: "0 14 * * 2"
  push:
    branches: [main]
    paths: [data.json, pipeline/**, .github/workflows/refresh-data.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Build summary, player files and live results
        run: python pipeline/build_site_data.py

      - name: Commit if anything changed
        run: |
          git config user.name "fantasy-terminal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh weekly results and split data"
            git pull --rebase origin main
            git push
          fi
